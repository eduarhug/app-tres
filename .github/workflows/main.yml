name: Compilador APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK
        working-directory: ./AjedrezEpico
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AjedrezEpico/app/build/outputs/apk/debug/app-debug.apk
