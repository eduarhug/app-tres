name: Compilador APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # AQUÍ ESTÁ LA CLAVE: Le decimos que entre a la carpeta AjedrezEpico
      - name: Compilar APK con Gradle
        working-directory: ./AjedrezEpico
        run: ./gradlew assembleDebug

      # Guardar el APK generado para poder descargarlo
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AjedrezEpico/app/build/outputs/apk/debug/app-debug.apk
