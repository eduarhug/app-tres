<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ajedrez Épico</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#12122a}
body{background:radial-gradient(circle at 50% 0%,#2f3280 0%,#12122a 65%)}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);overflow:auto}
.screen.on{display:flex}
h1{margin:6px 0 2px;font-size:30px;letter-spacing:.5px;text-shadow:0 3px 0 #0006}
.sub{margin:0 0 14px;opacity:.75;font-size:14px;text-align:center}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(96vw,520px)}
.lv{aspect-ratio:1;border-radius:15px;font-weight:800;font-size:21px;position:relative;box-shadow:0 4px 0 #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv small{font-size:11px;font-weight:600;opacity:.95;letter-spacing:1px;height:13px}
.lv.m1{background:linear-gradient(#43c06b,#2a8f4d)}.lv.m2{background:linear-gradient(#3b9bff,#2468c9)}.lv.m3{background:linear-gradient(#a65cff,#7132c9)}.lv.m4{background:linear-gradient(#ff5d5d,#c22b3a)}
.lv.lock{filter:grayscale(1);opacity:.35}
.lv .tag{position:absolute;top:3px;left:6px;font-size:9px;opacity:.85;font-weight:700}
.legend{display:flex;gap:12px;font-size:12px;opacity:.8;margin:12px 0 4px;flex-wrap:wrap;justify-content:center}
.legend i{font-style:normal;padding:2px 8px;border-radius:8px}
.top{display:flex;align-items:center;gap:10px;width:min(96vw,560px);margin-top:2px}
.ib{background:#ffffff22;border-radius:12px;width:42px;height:42px;font-size:20px}
#ttl{font-weight:800;font-size:19px;flex:1}
#badge{padding:5px 12px;border-radius:20px;font-weight:800;font-size:14px;background:#7132c9}
#hud{margin:10px 0 10px;font-size:14px;opacity:.9;text-align:center;min-height:20px}
#game{justify-content:center}
#board{position:relative;width:min(96vw,calc(100vh - 270px),560px);aspect-ratio:1}
#sqs{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:10px;overflow:hidden;box-shadow:0 10px 34px #000a,0 0 0 5px #5d4037}
.sq{position:relative}.sq.l{background:#f0dcb4}.sq.d{background:#b98b5e}
.sq[data-f]::after{content:attr(data-f);position:absolute;right:3px;bottom:1px;font-size:9px;opacity:.55;color:#3e2723}
.sq[data-r]::before{content:attr(data-r);position:absolute;left:3px;top:1px;font-size:9px;opacity:.55;color:#3e2723}
.sq.sel{box-shadow:inset 0 0 0 4px #ffd54f;background:#ffe082}
.sq.hint{animation:pulse .9s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px #00e676;background:#b9f6ca}}
#pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;will-change:transform;--sk:#f6c9a0;--mt:#cfd8dc}
.pc.w{--c1:#3b82f6;--c2:#1e3a8a;--ac:#fde68a;--hr:#f5c542}
.pc.b{--c1:#c62828;--c2:#4a1020;--ac:#ffab91;--hr:#2b1b17}
.pc svg{width:100%;height:100%;overflow:visible;display:block}
.pc .body{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.pc .weapon{transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.05)}}
.pc.selp .body{animation:hop .45s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-9%) scale(1.06)}}
.pc.atk .weapon{animation:swing .62s ease-in-out}
@keyframes swing{0%{transform:rotate(0)}28%{transform:rotate(-62deg)}58%{transform:rotate(78deg)}100%{transform:rotate(0)}}
.pc.t-n.atk .body{animation:rear .62s ease-in-out}
@keyframes rear{0%{transform:rotate(0)}35%{transform:rotate(-24deg) scale(1.1)}60%{transform:rotate(14deg) scale(1.08)}100%{transform:rotate(0)}}
.pc.shake .body{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-10%)}40%{transform:translateX(10%)}60%{transform:translateX(-7%)}80%{transform:translateX(7%)}}
.fx{position:absolute;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq,40px)*.95);pointer-events:none;z-index:30;width:12.5%;height:12.5%}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(26px,9vw,52px);font-weight:900;text-align:center;color:#ffd54f;text-shadow:0 4px 0 #b71c1c,0 0 24px #000;z-index:40;pointer-events:none;animation:popb .7s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
@keyframes popb{0%{transform:translate(-50%,-50%) scale(.1) rotate(-12deg);opacity:0}100%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#bar{display:flex;gap:12px;margin-top:14px;width:min(96vw,560px)}
#bar button{flex:1;padding:13px 8px;border-radius:14px;background:#ffffff22;font-weight:700;font-size:15px}
#bar button.pri{background:#2e7d32}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(16px);background:#14142cf0;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;max-width:90vw;text-align:center;pointer-events:none;z-index:70;font-size:14px;border:1px solid #fff3}
#toast.show{opacity:1;transform:translateX(-50%)}
#win{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#win.on{display:flex}
.card{background:linear-gradient(#2c2f7a,#1a1a40);border-radius:22px;padding:24px 22px;text-align:center;width:min(90vw,380px);box-shadow:0 12px 40px #000a;border:2px solid #ffd54f55;animation:popc .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popc{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-size:26px}
.stars{font-size:44px;letter-spacing:6px;color:#ffd54f;text-shadow:0 3px 0 #0006;margin:6px 0 14px}
.card button{display:block;width:100%;padding:13px;margin-top:10px;border-radius:14px;font-weight:800;font-size:16px;background:#ffffff22}
.card button.pri{background:#2e7d32}
</style></head>

/* ---------- sonido ---------- */
let AC;
function tone(f,d,type='sine',v=.15,delay=0,slide=0){
  if(muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}

  check:()=>{tone(660,.12,'square',.12);tone(880,.16,'square',.12,.12)},wrong:()=>tone(160,.22,'square',.14,0,-50),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.2,i*.14))};

  lvl=i;const L=LEVELS[i];closeWin();clearHint();piecesEl.innerHTML='';piecesEl.querySelectorAll('.banner').forEach(b=>b.remove());
  boardEl.querySelectorAll('.banner').forEach(b=>b.remove());map={};

  errors++;SND.wrong();p.el.classList.remove('shake');void p.el.offsetWidth;p.el.classList.add('shake');setTimeout(()=>p.el.classList.remove('shake'),520);
  toast('Ese movimiento no lleva al mate. ¡Prueba otro!');
}
/* ---------- animaciones ---------- */
function moveEl(el,a,b,type){
  const dist=Math.hypot(b[0]-a[0],b[1]-a[1]);const dur=Math.round((type==='n'?600:380)+dist*(type==='n'?70:105));let fr,ease='linear';
  if(type==='n'){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-.95;fr=[{transform:tf(a[0],a[1])},{transform:tf(mx,my,'scale(1.28) rotate(-9deg)'),offset:.5},{transform:tf(b[0],b[1],'scale(1.05)')},{transform:tf(b[0],b[1])}];ease='ease-in-out'}
  else{const n=Math.max(2,Math.round(dist*2));fr=[];for(let i=0;i<=n;i++){const t=i/n,last=i===n;fr.push({transform:tf(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t-(i%2&&!last?.1:0),last?'':(i%2?'rotate(5deg)':'rotate(-5deg)'))})}}
  const an=el.animate(fr,{duration:dur,easing:ease});
  return an.finished.catch(()=>{}).then(()=>{el.style.transform=tf(b[0],b[1]);an.cancel()});
}
function burst(sq,ch){const[x,y]=sqXY(sq);const f=document.createElement('div');f.className='fx';f.textContent=ch;f.style.left=x*12.5+'%';f.style.top=y*12.5+'%';boardEl.appendChild(f);
  f.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.3)',opacity:1,offset:.35},{transform:'scale(1.7)',opacity:0}],{duration:650}).finished.catch(()=>{}).then(()=>f.remove())}
function defeat(v){const[x,y]=sqXY(v.sq);const a=v.el.animate([
  {transform:tf(x,y),opacity:1,filter:'brightness(1)'},{transform:tf(x,y,'translateX(-12%) rotate(-12deg)'),filter:'brightness(2.2)',offset:.18},
  {transform:tf(x,y,'translateX(12%) rotate(12deg)'),filter:'brightness(1.6)',offset:.36},{transform:tf(x,y,'translateY(-70%) rotate(260deg) scale(.15)'),opacity:0,filter:'brightness(1)'}],{duration:760,easing:'ease-in'});
  a.finished.catch(()=>{}).then(()=>v.el.remove())}
async function attack(p,v,pos,dir){
  p.el.classList.add('atk');
  const lunge=p.el.animate([{transform:tf(pos[0],pos[1])},{transform:tf(pos[0]+dir[0]*.2,pos[1]+dir[1]*.2,'scale(1.14)'),offset:.45},{transform:tf(pos[0],pos[1])}],{duration:640,easing:'ease-in-out'});
  await sleep(330);SND.hit();burst(v.sq,p.t==='b'?'✨':'💥');defeat(v);
  await lunge.finished.catch(()=>{});p.el.classList.remove('atk');await sleep(120);
}
function kingOf(c){return Object.values(map).find(q=>q.t==='k'&&q.c===c)}
function wobble(k){if(!k)return;k.el.classList.remove('shake');void k.el.offsetWidth;k.el.classList.add('shake');setTimeout(()=>k.el.classList.remove('shake'),520)}
async function play(mv,color){
  busy=true;const u=mv[0],from=u.slice(0,2),to=u.slice(2,4),p=map[from],v=map[to]||null;
  const a=sqXY(from),b=sqXY(to);p.el.style.zIndex=20;SND.move();
  if(v){const q=[a[0]+(b[0]-a[0])*.7,a[1]+(b[1]-a[1])*.7];
    await moveEl(p.el,a,q,p.t);await attack(p,v,q,[b[0]-a[0],b[1]-a[1]]);await moveEl(p.el,q,b,p.t)}
  else await moveEl(p.el,a,b,p.t);
  delete map[from];map[to]=p;p.sq=to;p.el.style.zIndex='';
  if(p.t==='p'&&(to[1]==='8'||to[1]==='1')){p.t='q';p.el.className='pc '+p.c+' t-q';p.el.innerHTML=svgFor('q');burst(to,'👑')}
  if(color==='w'){movesLeft--;if(mv[3]){await finale();return}}
  if(mv[2]){SND.check();toast('¡Jaque!',1400);wobble(kingOf(color==='w'?'b':'w'))}
  node=mv[4];
  if(color==='w'){await sleep(520);await play(D()[node][1][0],'b')}
  else{busy=false;hud()}
}
function confetti(){const cols=['#ffd54f','#ff5252','#69f0ae','#40c4ff','#e040fb'];for(let i=0;i<46;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=(2+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.9+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}
async function finale(){
  done=true;SND.win();hud();$('#hud').textContent='';
  const bn=document.createElement('div');bn.className='banner';bn.textContent='¡JAQUE MATE!';boardEl.appendChild(bn);confetti();
  const bk=kingOf('b');if(bk){const[x,y]=sqXY(bk.sq);bk.el.animate([{transform:tf(x,y),opacity:1},{transform:tf(x,y,'rotate(80deg) translate(10%,8%)'),opacity:.9,offset:.5},{transform:tf(x,y,'rotate(96deg) translate(22%,16%)'),opacity:.4}],{duration:1000,fill:'forwards',easing:'ease-in'})}
  Object.values(map).filter(q=>q.c==='w').forEach((q,i)=>{const[x,y]=sqXY(q.sq);q.el.animate([{transform:tf(x,y)},{transform:tf(x,y,'translateY(-38%) rotate(-7deg)'),offset:.5},{transform:tf(x,y)}],{duration:520,iterations:3,delay:i*80,easing:'ease-in-out'})});
  await sleep(2500);winPanel();
}
function winPanel(){
  const s=(errors===0&&hints===0)?3:(errors<=2&&hints<=1)?2:1;save.stars[lvl]=Math.max(save.stars[lvl]||0,s);persist();
  $('#ws').textContent='★'.repeat(s)+'☆'.repeat(3-s);
  const last=lvl===LEVELS.length-1;$('#wt').textContent=last?'¡Completaste los 30 niveles! 👑':'¡Nivel completado!';
  $('#wm').textContent=errors?`Intentos fallidos: ${errors}${hints?' · Pistas: '+hints:''}`:(hints?`Pistas usadas: ${hints}`:'¡Sin errores ni pistas!');
  $('#wnext').style.display=last?'none':'block';$('#win').classList.add('on');
}
function closeWin(){$('#win').classList.remove('on')}
$('#wnext').onclick=()=>loadLevel(lvl+1);$('#wrep').onclick=()=>loadLevel(lvl);$('#wmenu').onclick=()=>showMenu();
$('#reset').onclick=()=>{if(!busy||done)loadLevel(lvl)};
$('#back').onclick=()=>showMenu();
$('#hint').onclick=()=>{
  if(busy||done)return;clearSel();clearHint();hints++;const m=movesOf()[0][0];
  sqEls[m.slice(0,2)].classList.add('hint');sqEls[m.slice(2,4)].classList.add('hint');toast('Pista: mueve la pieza marcada a la otra casilla marcada',2600);
  hintT=setTimeout(clearHint,4500);
};
/* ---------- menú ---------- */
function showMenu(){
  closeWin();clearHint();const g=$('#grid');g.innerHTML='';
  LEVELS.forEach((L,i)=>{const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;const b=document.createElement('button');
    b.className='lv m'+L.n+(open?'':' lock');const st=save.stars[i]||0;
    b.innerHTML=`<span class="tag">M${L.n}</span>${open?i+1:'🔒'}<small>${open?'★'.repeat(st)+'☆'.repeat(3-st):''}</small>`;
    if(open)b.onclick=()=>loadLevel(i);g.appendChild(b)});
  muteLabel();show('menu');
}
window.goBack=()=>{if($('#game').classList.contains('on')){showMenu();return true}return false};
window.__g={loadLevel,tryMove,movesOf:()=>movesOf(),state:()=>({lvl,node,done,busy,movesLeft,errors}),LEVELS,map:()=>map};
showMenu();
</script></body></html>
